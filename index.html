<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive CompTIA Security+ SY0-701 learning platform: lessons, visual simulations, labs, flashcards, practice questions, PBQs and mock exams." />
    <meta name="theme-color" content="#060a13" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Security+ Lab · SY0-701 Interactive</title>
    <script>
      // Apply the saved theme before React renders to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem('sy0701-progress');
          var s = raw ? (JSON.parse(raw).state || {}).settings || {} : {};
          var theme = s.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#060a13' : '#f4f6fb');
          if (s.motion === 'reduce') document.documentElement.classList.add('reduce-motion');
          if (s.motion === 'full') document.documentElement.classList.add('force-motion');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* Instant loading screen, shown until the app's JavaScript has loaded (React replaces #root). */
      html { background: #f4f6fb; }
      html.dark { background: #060a13; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0b1220; text-align: center; }
      html.dark .boot { color: #e8eef8; }
      .boot svg { width: 56px; height: 56px; }
      .boot-title { font-weight: 700; font-size: 18px; }
      .boot-sub { font-size: 14px; color: #56657c; }
      html.dark .boot-sub { color: #8494ae; }
      .boot-bar { width: 148px; height: 4px; margin-top: 6px; border-radius: 999px; background: rgba(127, 127, 127, 0.22); overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: #0e7490; animation: boot-slide 1.1s ease-in-out infinite; }
      html.dark .boot-bar span { background: #22d3ee; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar span { animation: none; width: 100%; opacity: 0.55; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="boot-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" /><stop offset="1" stop-color="#6366f1" /></linearGradient></defs>
          <path d="M32 4 8 13v17c0 15 10 26 24 30 14-4 24-15 24-30V13L32 4z" fill="url(#boot-g)" />
          <path d="M24 31h16v13H24z" fill="#060a13" />
          <path d="M27 31v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#060a13" stroke-width="3" />
          <circle cx="32" cy="37" r="2.4" fill="#22d3ee" />
        </svg>
        <div class="boot-title">Security+ Lab</div>
        <div class="boot-sub">Loading lessons…</div>
        <div class="boot-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <noscript>This learning platform needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
